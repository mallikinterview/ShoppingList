name: shopping-list

# Nine services, one command. Every service has a healthcheck; every dependent waits on
# `service_healthy` rather than `service_started`, so startup ordering is deterministic
# instead of racy. Only the API, Keycloak, Grafana and the Minio console are published to
# the host — the rest talk over the internal network.
#
# Ollama is the one that catches people out: the image ships with NO models. `ollama-init`
# pulls the embedding model into the shared volume and exits, and the API waits on
# `service_completed_successfully` — so the API can never start against an empty model store.

services:

  # ── Data ────────────────────────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg17
    container_name: sl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KEYCLOAK_DB: ${KEYCLOAK_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the pgvector extension and Keycloak's separate database on first boot.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # published for local tooling (DBeaver) only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7.4-alpine
    container_name: sl-redis
    restart: unless-stopped
    # Bounded memory with LRU eviction: a cache that can exhaust the host is not a cache.
    command: >
      redis-server
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"      # published for RedisInsight only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 384m

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: sl-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Embeddings ──────────────────────────────────────────────────────────────────────

  ollama:
    image: ollama/ollama:0.6.8
    container_name: sl-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # Not published: nothing outside the stack needs to reach the model server.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 2g

  # Run-once: pulls the embedding model into the shared volume, then exits 0.
  # The API gates on `service_completed_successfully`, which is what makes a cold
  # `docker compose up` work first try instead of failing on an empty model store.
  ollama-init:
    image: ollama/ollama:0.6.8
    container_name: sl-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Pulling embedding model ${OLLAMA_EMBEDDING_MODEL}..."
        ollama pull ${OLLAMA_EMBEDDING_MODEL}
        echo "Model ready."
    networks: [backend]

  # ── Identity ────────────────────────────────────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: sl-keycloak
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["start", "--import-realm", "--optimized=false"]
    environment:
      # Production posture: a real database, not the in-memory H2 that `start-dev` uses
      # and that loses every user on restart.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}

      # ── The Docker issuer trap ──
      # Tokens carry `iss` derived from KC_HOSTNAME. Pinning it to the host-visible URL
      # keeps the issuer stable no matter who is calling, while BACKCHANNEL_DYNAMIC lets
      # the API resolve discovery over the internal network. The alternative most
      # submissions reach for — ValidateIssuer=false in the API — is a security hole.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      # Realm, client, audience mapper, roles and demo user — imported on first boot so
      # a reviewer never touches the admin console.
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      # Keycloak 26 exposes health on the management port (9000) and ships no curl,
      # so this drives its own JVM to probe itself.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": *"UP"' <&3
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 45s
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Observability ───────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: sl-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 512m

  loki:
    image: grafana/loki:3.4.2
    container_name: sl-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    user: "0"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 512m

  grafana:
    image: grafana/grafana:11.6.0
    container_name: sl-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_FEATURE_TOGGLES_ENABLE: traceToLogs
    volumes:
      # Datasources and dashboard are provisioned from committed files: `docker compose up`
      # then open Grafana and the dashboard already has data. No click-through setup.
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Application ─────────────────────────────────────────────────────────────────────

  # Migrations run as their own service, not from the API's startup path. Applying them
  # from the API means N replicas race the same migration; a dedicated one-shot job is
  # the pattern that survives horizontal scaling.
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: shopping-list-api:local
    container_name: sl-migrator
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      DatabaseSettings__ConnectionString: ${DatabaseSettings__ConnectionString}

      # The only other setting a migration depends on: the schema asserts that the pgvector
      # column width matches the configured embedding dimension, because pgvector columns are
      # fixed-width and a mismatch is otherwise discovered as an opaque error on first write.
      OllamaSettings__EmbeddingDimensions: ${OllamaSettings__EmbeddingDimensions}
    command: ["--migrate-only"]
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: shopping-list-api:local
    container_name: sl-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      loki:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: "8080"

      DatabaseSettings__ConnectionString: ${DatabaseSettings__ConnectionString}
      DatabaseSettings__MaxPoolSize: ${DatabaseSettings__MaxPoolSize}
      DatabaseSettings__CommandTimeoutSeconds: ${DatabaseSettings__CommandTimeoutSeconds}

      RedisSettings__ConnectionString: ${RedisSettings__ConnectionString}
      RedisSettings__AbortOnConnectFail: ${RedisSettings__AbortOnConnectFail}
      RedisSettings__UseSsl: ${RedisSettings__UseSsl}
      RedisSettings__InstanceName: ${RedisSettings__InstanceName}
      RedisSettings__DefaultTtlSeconds: ${RedisSettings__DefaultTtlSeconds}
      RedisSettings__TtlJitterSeconds: ${RedisSettings__TtlJitterSeconds}

      MinioSettings__Endpoint: ${MinioSettings__Endpoint}
      MinioSettings__AccessKey: ${MinioSettings__AccessKey}
      MinioSettings__SecretKey: ${MinioSettings__SecretKey}
      MinioSettings__BucketName: ${MinioSettings__BucketName}
      MinioSettings__UseSsl: ${MinioSettings__UseSsl}
      MinioSettings__PublicEndpoint: ${MinioSettings__PublicEndpoint}
      MinioSettings__PresignedUrlExpirySeconds: ${MinioSettings__PresignedUrlExpirySeconds}
      MinioSettings__MaxUploadBytes: ${MinioSettings__MaxUploadBytes}

      KeycloakSettings__Authority: ${KeycloakSettings__Authority}
      KeycloakSettings__MetadataAddress: ${KeycloakSettings__MetadataAddress}
      KeycloakSettings__TokenEndpoint: ${KeycloakSettings__TokenEndpoint}
      KeycloakSettings__AdminBaseUrl: ${KeycloakSettings__AdminBaseUrl}
      KeycloakSettings__Realm: ${KeycloakSettings__Realm}
      KeycloakSettings__Audience: ${KeycloakSettings__Audience}
      KeycloakSettings__ClientId: ${KeycloakSettings__ClientId}
      KeycloakSettings__ClientSecret: ${KeycloakSettings__ClientSecret}
      KeycloakSettings__RequireHttpsMetadata: ${KeycloakSettings__RequireHttpsMetadata}
      KeycloakSettings__ClockSkewSeconds: ${KeycloakSettings__ClockSkewSeconds}

      OllamaSettings__BaseUrl: ${OllamaSettings__BaseUrl}
      OllamaSettings__EmbeddingModel: ${OllamaSettings__EmbeddingModel}
      OllamaSettings__EmbeddingDimensions: ${OllamaSettings__EmbeddingDimensions}
      OllamaSettings__TimeoutSeconds: ${OllamaSettings__TimeoutSeconds}
      OllamaSettings__MaxRetries: ${OllamaSettings__MaxRetries}

      SearchSettings__Strategy: ${SearchSettings__Strategy}
      SearchSettings__RrfK: ${SearchSettings__RrfK}
      SearchSettings__VectorWeight: ${SearchSettings__VectorWeight}
      SearchSettings__TextWeight: ${SearchSettings__TextWeight}
      SearchSettings__CandidateLimit: ${SearchSettings__CandidateLimit}
      SearchSettings__MaxPageSize: ${SearchSettings__MaxPageSize}
      SearchSettings__MaxVectorDistance: ${SearchSettings__MaxVectorDistance}
      SearchSettings__Experiment__Enabled: ${SearchSettings__Experiment__Enabled}
      SearchSettings__Experiment__Key: ${SearchSettings__Experiment__Key}
      SearchSettings__Experiment__VariantSplit: ${SearchSettings__Experiment__VariantSplit}
      SearchSettings__Experiment__ControlStrategy: ${SearchSettings__Experiment__ControlStrategy}
      SearchSettings__Experiment__TreatmentStrategy: ${SearchSettings__Experiment__TreatmentStrategy}

      RateLimitSettings__PermitLimit: ${RateLimitSettings__PermitLimit}
      RateLimitSettings__WindowSeconds: ${RateLimitSettings__WindowSeconds}
      RateLimitSettings__AuthPermitLimit: ${RateLimitSettings__AuthPermitLimit}
      RateLimitSettings__AuthWindowSeconds: ${RateLimitSettings__AuthWindowSeconds}
      RateLimitSettings__UploadPermitLimit: ${RateLimitSettings__UploadPermitLimit}
      RateLimitSettings__UploadWindowSeconds: ${RateLimitSettings__UploadWindowSeconds}

      SerilogSettings__LokiUrl: ${SerilogSettings__LokiUrl}
      SerilogSettings__MinimumLevel: ${SerilogSettings__MinimumLevel}
      SerilogSettings__ApplicationName: ${SerilogSettings__ApplicationName}
    ports:
      - "${API_PORT:-5080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 768m

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  ollama-models:
  prometheus-data:
  loki-data:
  grafana-data:
