apiVersion: 1

# Provisioned from file so a fresh `docker compose up` yields a Grafana that already has
# its datasources wired. No admin click-through, no "now add Prometheus as a datasource"
# step in the README.

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      # Correlation IDs are emitted on every log line, so a log can be pivoted straight
      # to the rest of its request without hand-copying an identifier.
      derivedFields:
        - name: CorrelationId
          matcherRegex: '"CorrelationId":"([^"]+)"'
          url: '/explore?left={"datasource":"loki","queries":[{"expr":"{app=\"shopping-list-api\"} |= \"$${__value.raw}\""}]}'
          datasourceUid: loki
