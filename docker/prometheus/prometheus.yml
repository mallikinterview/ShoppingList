global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    stack: shopping-list

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # The API exports OpenTelemetry metrics in Prometheus format. Metric names here must
  # match what the code registers — a dashboard referencing a renamed metric renders empty
  # panels and looks like the instrumentation is broken.
  - job_name: shopping-list-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: shopping-list-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Keycloak exposes metrics on the management port when KC_METRICS_ENABLED=true.
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]
        labels:
          service: keycloak

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: loki
